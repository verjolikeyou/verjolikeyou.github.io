<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Programme en 11 eme</title>
    <meta
      name="description"
      content="Application scolaire hors-ligne de 11ème (Français, Mathématiques, Cours, Dessin, Anglais, Méthode Boscher, Leçons de chose) prête pour PWABuilder & APK Android."
    />
    <meta property="og:title" content="Programme en 11 eme" />
    <meta
      property="og:description"
      content="Programme scolaire complet de 11ème : leçons et exercices 100% hors-ligne."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Configuration PWA & APK Offline sans barre URL (comme un jeu plein écran) -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#4CC9F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prog 11ème" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
