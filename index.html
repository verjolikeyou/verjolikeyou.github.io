8 L142,35 Z\" fill=\"#FACC15\" stroke=\"#B45309\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"103\" cy=\"16\" r=\"2.5\" fill=\"#F472B6\"/><circle cx=\"120\" cy=\"10\" r=\"3\" fill=\"#A855F7\"/><circle cx=\"137\" cy=\"16\" r=\"2.5\" fill=\"#F472B6\"/><ellipse cx=\"120\" cy=\"27\" rx=\"3.5\" ry=\"4.5\" fill=\"#9333EA\"/></svg></div> <div style=\"background:#FDF2F8; border:2px solid #F472B6; border-radius:14px; padding:14px; margin-top:12px;\"> <p style=\"font-size:18px; font-weight:900; color:#DB2777; text-align:center; margin-bottom:4px;\"> 👑 How to Draw a Princess — 11 Easy Steps </p> <p style=\"text-align:center; font-size:13px; color:#6B7280; font-weight:bold; margin-bottom:12px;\"> Astuce : Utilise un crayon léger au début, puis repasse et colorie ta princesse ! </p> <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px;\"> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 1 • Tête :</b><br> Tracer un cercle pour la tête (Draw a circle for the head). </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 2 • Robe :</b><br> Tracer la ligne centrale du corps et la forme triangulaire évasée de la robe. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 3 • Épaules &amp; taille :</b><br> Esquisser les épaules, les manches bouffantes, la taille et les bras. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 4 • Couronne :</b><br> Ajouter la couronne à pointes au sommet de la tête. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 5 • Contour cheveux :</b><br> Tracer le contour de la chevelure autour du visage et sous la couronne. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 6 • Cheveux longs :</b><br> Dessiner les longs cheveux ondulés sur les épaules et finir les bras et mains. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 7 • Visage :</b><br> Ajouter les grands yeux avec cils, le nez, le joli sourire et les boucles d'oreilles. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#DB2777;\">Étape 8 • Détails de la robe :</b><br> Dessiner le corsage festonné, la ceinture et les plis ondulés en bas de la jupe. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#7E22CE;\">Étape 9 • Joyaux &amp; mèches :</b><br> Ajouter les perles et le joyau violet sur la couronne, la boucle et les mèches. </div> <div style=\"background:#FFFFFF; border:2px solid #FBCFE8; border-radius:10px; padding:10px;\"> <b style=\"color:#D81B60;\">Étape 10 • Coloriage final :</b><br> Colorier les cheveux en blond doré, la couronne dorée et la belle robe rose ! </div> </div> </div> </div> <div class=\"ruban-cote\"><span>🌸</span><span>💎</span><span>👑</span><span>🌟</span><span>⭐</span></div> </div> <div style=\"text-align:center;\"> <a href=\"#/dessin\" class=\"btn-retour\">← Revenir au choix du Dessin</a> </div>"};
    const appEl = document.getElementById("app");
    let loadingTimer = null;

    function renderLoading(matiere, targetHash) {
      if (loadingTimer) clearTimeout(loadingTimer);
      appEl.innerHTML = '<div style="text-align:center;padding:20px 10px;"><h1 class="titre-principal">Programme en 11 eme</h1><div style="font-size:24px;font-weight:bold;color:#2B8A3E;margin:12px 0;">' + matiere + '</div><div class="loader-ring"><div></div><div></div><div></div><div></div></div><div style="font-size:19px;font-weight:bold;color:#3A0CA3;margin-top:14px;">Chargement en cours...</div></div>';
      loadingTimer = setTimeout(function() { window.location.hash = targetHash; }, 1500);
    }

    function wireMenuInteractions() {
      const boutons = appEl.querySelectorAll(".btn-option");
      const sousTitre = appEl.querySelector(".sous-titre-selection");
      const btnValider = appEl.querySelector("#btn-valider");
      if (!boutons.length || !btnValider) return;

      let urlChoisie = boutons[0].getAttribute("data-url") || "#/";
      let matiereChargement = boutons[0].getAttribute("data-chargement");
      boutons[0].classList.add("selected");
      if (sousTitre && boutons[0].getAttribute("data-titre")) {
        sousTitre.textContent = boutons[0].getAttribute("data-titre");
      }

      boutons.forEach(function(b) {
        b.addEventListener("click", function() {
          boutons.forEach(function(x) { x.classList.remove("selected"); });
          b.classList.add("selected");
          urlChoisie = b.getAttribute("data-url") || "#/";
          matiereChargement = b.getAttribute("data-chargement");
          if (sousTitre && b.getAttribute("data-titre")) {
            sousTitre.textContent = b.getAttribute("data-titre");
          }
        });
      });

      btnValider.addEventListener("click", function() {
        if (matiereChargement) {
          renderLoading(matiereChargement, urlChoisie);
        } else {
          window.location.hash = urlChoisie;
        }
      });
    }

    
    function encodeCandidateUrl(rawPath) {
      let base = rawPath;
      try { base = decodeURIComponent(rawPath); } catch (e) {
        try { base = decodeURI(rawPath); } catch (e2) { base = rawPath; }
      }
      return encodeURI(base).replace(/'/g, "%27");
    }
    function loadScriptTag(src) {
      return new Promise(function(resolve, reject) {
        const el = document.createElement("script");
        el.src = src;
        el.async = true;
        el.onload = resolve;
        el.onerror = function() { el.remove(); reject(new Error("Script load failed: " + src)); };
        document.head.appendChild(el);
      });
    }
    let pdfJsPromise = null;
    function ensurePdfJs() {
      if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
      if (pdfJsPromise) return pdfJsPromise;
      pdfJsPromise = (async function() {
        const srcs = [
          { l: "./pdf.min.js", w: "./pdf.worker.min.js" },
          { l: "/pdf.min.js", w: "/pdf.worker.min.js" },
          { l: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", w: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" },
          { l: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js", w: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js" }
        ];
        for (const src of srcs) {
          try {
            await loadScriptTag(src.l);
            if (window.pdfjsLib) {
              window.pdfjsLib.GlobalWorkerOptions.workerSrc = src.w;
              return window.pdfjsLib;
            }
          } catch (e) {}
        }
        pdfJsPromise = null;
        throw new Error("PDF.js indisponible");
      })();
      return pdfJsPromise;
    }
    function isPdfBytes(buf) {
      if (!buf || buf.byteLength < 5) return false;
      const b = new Uint8Array(buf, 0, Math.min(buf.byteLength, 16));
      for (let i = 0; i <= b.length - 5; i++) {
        if (b[i] === 0x25 && b[i + 1] === 0x50 && b[i + 2] === 0x44 && b[i + 3] === 0x46 && b[i + 4] === 0x2D) {
          return true;
        }
      }
      return false;
    }
    async function renderPdfPages(doc, containerEl, zoom) {
      containerEl.innerHTML = "";
      const width = Math.max(240, (containerEl.clientWidth || 560) - 20);
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const vpBase = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: (width / vpBase.width) * zoom });
        const wrap = document.createElement("div");
        wrap.className = "pdf-page-wrap";
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);
        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";
        const ctx = canvas.getContext("2d");
        if (ctx) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        }
        const num = document.createElement("div");
        num.className = "pdf-page-num";
        num.textContent = "Page " + i + " / " + doc.numPages;
        wrap.appendChild(canvas);
        wrap.appendChild(num);
        containerEl.appendChild(wrap);
      }
    }
    async function initPdfViewers() {
      const boxes = document.querySelectorAll(".pdf-viewer-box");
      if (!boxes.length) return;
      boxes.forEach(async function(box) {
        if (box.getAttribute("data-pdf-init") === "1") return;
        box.setAttribute("data-pdf-init", "1");
        const label = box.getAttribute("data-pdf-label") || "PDF";
        const accent = box.getAttribute("data-accent") || "#4361EE";
        let candidates = [];
        try { candidates = JSON.parse(box.getAttribute("data-pdf-candidates") || "[]"); } catch (e) {}
        box.style.borderColor = accent;
        box.innerHTML = '<div class="pdf-header"><div class="pdf-title" style="color:' + accent + ';">' + label + '</div><div class="pdf-toolbar"><button type="button" class="pdf-btn pdf-zout">−</button><span class="pdf-zoom-label">100%</span><button type="button" class="pdf-btn pdf-zin">+</button><a class="pdf-btn pdf-open" style="display:none;" target="_blank" rel="noopener">📄 Ouvrir</a></div></div><div class="pdf-status">⏳ Chargement du PDF en cours...</div><div class="pdf-pages"></div>';
        const st = box.querySelector(".pdf-status");
        const pgEl = box.querySelector(".pdf-pages");
        const openL = box.querySelector(".pdf-open");
        const zLab = box.querySelector(".pdf-zoom-label");
        let found = null;
        for (const rawCand of candidates) {
          const url = encodeCandidateUrl(rawCand);
          try {
            const resp = await fetch(url);
            if (!resp.ok) continue;
            const buf = await resp.arrayBuffer();
            if (isPdfBytes(buf)) {
              found = { url: url, buf: buf };
              break;
            }
          } catch (e) {}
        }
        if (!found) {
          st.innerHTML = '<div class="pdf-error-box">Document PDF introuvable dans <code>./pdfs/</code> ou à la racine du site. Placez le fichier PDF correspondant pour l\x27afficher ici.</div>';
          return;
        }
        openL.href = found.url;
        openL.style.display = "inline-flex";
        let zoom = 1.0;
        let doc = null;
        try {
          const lib = await ensurePdfJs();
          try {
            doc = await lib.getDocument({ data: found.buf.slice(0) }).promise;
            await renderPdfPages(doc, pgEl, zoom);
          } catch (workerErr) {
            doc = await lib.getDocument({ data: found.buf.slice(0), disableWorker: true }).promise;
            await renderPdfPages(doc, pgEl, zoom);
          }
          st.style.display = "none";
          box.querySelector(".pdf-zout").addEventListener("click", async function() {
            if (!doc || zoom <= 0.6) return;
            zoom = Math.round((zoom - 0.2) * 10) / 10;
            zLab.textContent = Math.round(zoom * 100) + "%";
            await renderPdfPages(doc, pgEl, zoom);
          });
          box.querySelector(".pdf-zin").addEventListener("click", async function() {
            if (!doc || zoom >= 2.2) return;
            zoom = Math.round((zoom + 0.2) * 10) / 10;
            zLab.textContent = Math.round(zoom * 100) + "%";
            await renderPdfPages(doc, pgEl, zoom);
          });
        } catch (err) {
          st.innerHTML = '<div class="pdf-error-box">Rendu canvas indisponible hors-ligne : utilisez le bouton <b>📄 Ouvrir</b> ci-dessus pour ouvrir le PDF.</div>';
        }
      });
    }
    function renderRoute() {
      if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
      const rawHash = window.location.hash.replace(/^#/, "");
      const route = rawHash && rawHash.startsWith("/") ? rawHash : "/";
      appEl.innerHTML = PAGES[route] || PAGES["/"];
      wireMenuInteractions();
      initPdfViewers();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    window.addEventListener("hashchange", renderRoute);
    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", renderRoute);
    } else {
      renderRoute();
    }

    function isStandaloneApp() {
      return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
        window.navigator.standalone === true ||
        localStorage.getItem("verjo_app_installed") === "1";
    }

    async function sendSwNotificationMessage(reg, type) {
      try {
        const target = (reg && reg.active) || navigator.serviceWorker.controller;
        if (!target) return;
        target.postMessage({
          type: type,
          granted: typeof Notification !== "undefined" && Notification.permission === "granted",
          installed: isStandaloneApp()
        });
      } catch (e) {}
    }

    async function registerBackgroundSchedules(reg) {
      if (!reg) return;
      try {
        if ("periodicSync" in reg) {
          const perm = await navigator.permissions.query({ name: "periodic-background-sync" });
          if (perm.state === "granted") {
            await reg.periodicSync.register("verjo-hourly-reminder", { minInterval: 24 * 60 * 60 * 1000 });
          }
        }
      } catch (e) {}
      try {
        if ("sync" in reg) {
          await reg.sync.register("verjo-hourly-check");
        }
      } catch (e) {}
    }

    function wireNotificationButton() {
      const notifBtn = document.getElementById("btn-enable-notif");
      if (!notifBtn || typeof Notification === "undefined") return;
      if (Notification.permission === "default") {
        notifBtn.style.display = "block";
        notifBtn.addEventListener("click", async function() {
          try {
            const res = await Notification.requestPermission();
            if (res === "granted") {
              notifBtn.style.display = "none";
              const reg = await navigator.serviceWorker.ready;
              await registerBackgroundSchedules(reg);
              await sendSwNotificationMessage(reg, "NOTIF_PERMISSION_GRANTED");
            } else if (res === "denied") {
              notifBtn.style.display = "none";
            }
          } catch (e) {}
        });
      } else {
        notifBtn.style.display = "none";
      }
    }

    const origWire = wireMenuInteractions;
    wireMenuInteractions = function() {
      origWire();
      wireNotificationButton();
    };
    wireNotificationButton();

    window.addEventListener("appinstalled", async function() {
      localStorage.setItem("verjo_app_installed", "1");
      if (typeof Notification !== "undefined" && Notification.permission === "default") {
        try { await Notification.requestPermission(); } catch (e) {}
      }
      if ("serviceWorker" in navigator) {
        try {
          const reg = await navigator.serviceWorker.ready;
          await registerBackgroundSchedules(reg);
          await sendSwNotificationMessage(reg, "APP_INSTALLED");
        } catch (e) {}
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async function() {
        try {
          const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
          const readyReg = await navigator.serviceWorker.ready;
          if (isStandaloneApp()) {
            localStorage.setItem("verjo_app_installed", "1");
          }
          if (typeof Notification !== "undefined" && Notification.permission === "granted") {
            await registerBackgroundSchedules(readyReg || reg);
            if (isStandaloneApp()) {
              await sendSwNotificationMessage(readyReg || reg, "APP_INSTALLED");
            }
            await sendSwNotificationMessage(readyReg || reg, "CHECK_HOURLY_NOTIF");
          }
        } catch (e) {}
      });
    }
